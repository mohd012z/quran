name: Quran Android APK research
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/quran-corpus-acquisition-audit.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
  push:
    branches:
      - research/quran-tajweed-foundation-20261108
    paths:
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/quran-corpus-acquisition-audit.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}/platforms"
          test -d "${ANDROID_HOME}/build-tools"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f -print
      - name: Build and test Quran web app
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          test -f dist/index.html
      - name: Generate Capacitor Android wrapper
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.msa.quran.research",
            "appName": "Al Quran Research",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Harden generated Gradle wrapper download
        working-directory: android
        run: |
          set -euo pipefail
          PROPS=gradle/wrapper/gradle-wrapper.properties
          test -s "$PROPS"
          grep -Fq 'gradle-8.2.1-all.zip' "$PROPS"
          sed -i '/^networkTimeout=/d' "$PROPS"
          printf '\nnetworkTimeout=120000\n' >> "$PROPS"
          grep -Fxq 'networkTimeout=120000' "$PROPS"
          grep '^distributionUrl=' "$PROPS"
      - name: Build debug APK with bounded network retries
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if bash ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-attempt.log; then
              exit 0
            fi
            if ! bash ../scripts/classify-gradle-failure.sh gradle-attempt.log; then
              echo "Non-network Gradle failure: no retry"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Transient Gradle dependency download still failing after 3 bounded attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Verify APK integrity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -Fq "Verified using v2 scheme" apk-signing.txt
          grep -Eq "^(V2 Signer|Signer #1): certificate SHA-256 digest: [0-9a-f]{64}$" apk-signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quran-research-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-signing.txt
          if-no-files-found: error
          retention-days: 7

  verify-corpus:
    if: github.ref == 'refs/heads/research/quran-tajweed-foundation-20261108' || github.head_ref == 'research/quran-tajweed-foundation-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve and verify without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, pathlib, re, urllib.request
          root = pathlib.Path("evidence")
          mirror = "https://raw.githubusercontent.com/iptvchecker/content-tanzil/main/tanzil-uthmani-1.1.txt"
          expected = "ac0724796cbbda0f4801470fbbd11d0f3c5802067bae0493466d0128b0c667af"
          result = {"source":mirror,"mirror_claimed_sha256":expected,"verified":False}
          try:
              req=urllib.request.Request(mirror,headers={"User-Agent":"quran-research-verifier/1.0"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(4_000_001)
              if len(data)>4_000_000: raise ValueError("file exceeds size cap")
              actual=hashlib.sha256(data).hexdigest()
              result.update(bytes=len(data),sha256=actual,mirror_checksum_matches=(actual==expected))
              if actual!=expected: raise ValueError("mirror SHA-256 mismatch")
              text=data.decode("utf-8-sig")
              if "Tanzil Quran Text" not in text or "Copyright" not in text: raise ValueError("Tanzil notice missing")
              rows=[]
              for line in text.splitlines():
                  if not line or line.startswith("#"):continue
                  match=re.fullmatch(r"(\d+)\|(\d+)\|(.+)",line)
                  if not match:raise ValueError("unexpected corpus row")
                  rows.append((int(match[1]),int(match[2]),match[3]))
              if len(rows)!=6236:raise ValueError(f"expected 6236 ayahs, got {len(rows)}")
              surahs={a for a,_,_ in rows}
              if surahs!=set(range(1,115)):raise ValueError("not 114 consecutive Surahs")
              previous=(1,0)
              for surah,ayah,arabic in rows:
                  if not arabic.strip():raise ValueError("empty Arabic verse")
                  if surah==previous[0]:
                      if ayah!=previous[1]+1:raise ValueError("nonconsecutive ayah")
                  elif surah==previous[0]+1:
                      if ayah!=1:raise ValueError("surah does not start at ayah 1")
                  else:raise ValueError("nonconsecutive surah")
                  previous=(surah,ayah)
              result.update(ayahs=len(rows),surahs=len(surahs),structural_verification=True)
              # Mirror parity alone is not publisher verification.
              result["verified"]=False
              result["reason"]="Official Tanzil publisher byte comparison not performed; do not publish"
          except Exception as exc:
              result["error"]=str(exc)
          (root/"audit.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if "error" in result:raise SystemExit(1)
          PY
      - name: Assert non-publishing gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("evidence/audit.json"))
          assert r["structural_verification"] and r["mirror_checksum_matches"]
          assert r["verified"] is False, "Publisher verification must be separate"
          print("PASS: mirror structural audit only; publishing prohibited")
          PY

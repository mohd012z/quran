name: Quran Android APK research
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
  push:
    branches:
      - research/quran-tajweed-foundation-20261108
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}/platforms"
          test -d "${ANDROID_HOME}/build-tools"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f -print
      - name: Build and test Quran web app
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          test -f dist/index.html
      - name: Generate Capacitor Android wrapper
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.msa.quran.research",
            "appName": "Al Quran Research",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Verify APK integrity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: quran-research-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7

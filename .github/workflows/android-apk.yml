name: Quran Android APK research
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/quran-corpus-acquisition-audit.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
  push:
    branches:
      - research/quran-tajweed-foundation-20261108
    paths:
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/quran-corpus-acquisition-audit.yml'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
permissions:
  contents: read
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Assert Git LFS pulled real assets (no pointer files)
        run: |
          set -euo pipefail
          if grep -rlq "version https://git-lfs.github.com/spec/v1" public/offline/ offline-sources/; then
            echo "ERROR: Git LFS pointer files found instead of real assets" >&2
            exit 1
          fi
          test "$(find public/offline/alafasy -name '*.mp3' | wc -l)" -eq 6236
          test -s public/offline/corpus.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}/platforms"
          test -d "${ANDROID_HOME}/build-tools"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f -print
      - name: Build and test Quran web app
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          test -f dist/index.html
      - name: Generate Capacitor Android wrapper
        run: |
          npm install --no-save --no-audit --no-fund @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.msa.quran.research",
            "appName": "Al Quran Research",
            "webDir": "dist",
            "server": { "androidScheme": "https" }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Harden generated Gradle wrapper download
        working-directory: android
        run: |
          set -euo pipefail
          PROPS=gradle/wrapper/gradle-wrapper.properties
          test -s "$PROPS"
          grep -Fq 'gradle-8.2.1-all.zip' "$PROPS"
          sed -i '/^networkTimeout=/d' "$PROPS"
          printf '\nnetworkTimeout=120000\n' >> "$PROPS"
          grep -Fxq 'networkTimeout=120000' "$PROPS"
          grep '^distributionUrl=' "$PROPS"
      - name: Build debug APK with bounded network retries
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if bash ./gradlew --no-daemon assembleDebug 2>&1 | tee gradle-attempt.log; then
              exit 0
            fi
            if ! bash ../scripts/classify-gradle-failure.sh gradle-attempt.log; then
              echo "Non-network Gradle failure: no retry"
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Transient Gradle dependency download still failing after 3 bounded attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
      - name: Verify APK integrity
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee apk-sha256.txt
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          grep -Fq "Verified using v2 scheme" apk-signing.txt
          grep -Eq "^(V2 Signer|Signer #1): certificate SHA-256 digest: [0-9a-f]{64}$" apk-signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quran-research-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
            apk-signing.txt
          if-no-files-found: error
          retention-days: 7

  verify-corpus:
    if: github.ref == 'refs/heads/research/quran-tajweed-foundation-20261108' || github.head_ref == 'research/quran-tajweed-foundation-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve and verify without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, pathlib, re, urllib.request
          root = pathlib.Path("evidence")
          mirror = "https://raw.githubusercontent.com/iptvchecker/content-tanzil/main/tanzil-uthmani-1.1.txt"
          expected = "ac0724796cbbda0f4801470fbbd11d0f3c5802067bae0493466d0128b0c667af"
          result = {"source":mirror,"mirror_claimed_sha256":expected,"verified":False}
          try:
              req=urllib.request.Request(mirror,headers={"User-Agent":"quran-research-verifier/1.0"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  data=response.read(4_000_001)
              if len(data)>4_000_000: raise ValueError("file exceeds size cap")
              actual=hashlib.sha256(data).hexdigest()
              result.update(bytes=len(data),sha256=actual,mirror_checksum_matches=(actual==expected))
              if actual!=expected: raise ValueError("mirror SHA-256 mismatch")
              text=data.decode("utf-8-sig")
              if "Tanzil Quran Text" not in text or "Copyright" not in text: raise ValueError("Tanzil notice missing")
              # Tanzil TXT is a plain one-ayah-per-line text, not pipe-delimited CSV.
              # The chapter boundaries are independently checked against the
              # standard 114-surah ayah-count table; Arabic bytes stay unchanged.
              expected_counts=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6]
              lines=[line for line in text.splitlines() if line.strip() and not line.startswith("#")]
              if lines:
                  result["first_ayah_prefix"]=lines[0][:48]
                  result["last_ayah_prefix"]=lines[-1][:48]
              if len(lines)!=6236:raise ValueError(f"expected 6236 ayah lines, got {len(lines)}")
              if len(expected_counts)!=114 or sum(expected_counts)!=6236:raise ValueError("invalid reference chapter counts")
              if any(not any(0x0600<=ord(ch)<=0x06ff for ch in line) for line in lines):
                  raise ValueError("non-Arabic ayah line")
              result.update(ayahs=len(lines),surahs=len(expected_counts),surah_ayah_counts=expected_counts,structural_verification=True, surah_boundary_parity_verified=False, publisher_byte_parity_verified=False, audit_scope="Mirror SHA256, 6236 Arabic lines, and reference chapter-count table only")
              # Mirror parity alone is not publisher verification.
              result["verified"]=False
              result["reason"]="Official Tanzil publisher byte comparison not performed; do not publish"
          except Exception as exc:
              result["error"]=str(exc)
          (root/"audit.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          if "error" in result:raise SystemExit(1)
          PY
      - name: Assert non-publishing gate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("evidence/audit.json"))
          assert r["structural_verification"] and r["mirror_checksum_matches"]
          assert r["verified"] is False, "Publisher verification must be separate"
          print("PASS: mirror structural audit only; publishing prohibited")
          PY
